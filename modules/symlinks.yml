# Symlinks configuration
# Format:
# - source: /path/to/source (relative to $HOME/dotfiles or absolute)
#   target: /path/to/target (relative to $HOME or absolute)
#   type: file|directory (optional, auto-detected if not specified)

# Import private symlinks
import:
  - modules/symlinks-private.local.yml

links:
  # Shell configuration
  - source: modules/bash/.bashrc
    target: ~/.bashrc

  - source: modules/zsh/.zshrc
    target: ~/.zshrc

  # Git configuration
  - source: modules/git/.gitconfig
    target: ~/.gitconfig

  - source: modules/git/.gitignore_global
    target: ~/.gitignore

  - source: modules/zed/settings.json
    target: ~/.config/zed/settings.json

  - source: modules/vim/.vimrc
    target: ~/.vimrc

  # Shelley agent hooks (includes the Traces bridge)
  - source: modules/shelley/hooks/traces-lib.sh
    target: ~/.config/shelley/hooks/traces-lib.sh
  - source: modules/shelley/hooks/new-conversation
    target: ~/.config/shelley/hooks/new-conversation
  - source: modules/shelley/hooks/chat-message
    target: ~/.config/shelley/hooks/chat-message
  - source: modules/shelley/hooks/end-of-turn
    target: ~/.config/shelley/hooks/end-of-turn
  - source: modules/shelley/hooks/traces-doctor
    target: ~/.config/shelley/hooks/traces-doctor
  - source: modules/shelley/hooks/slash/traces
    target: ~/.config/shelley/hooks/slash/traces
  # # Example absolute paths
  # - source: /Users/ashiknesin/dotfiles/config/custom_app
  #   target: /Applications/custom_app/config
  #   type: directory
